# Throwaway checker for the Splunk blind starter: runs adapters.toml (as JSON)
# and vectors.json through the repo's own Rust engine, and prints the overlap
# report. Not part of the product workspace.
[package]
name = "splunk-blind-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
adapter-templates = { path = "../../../../adapter-templates" }
serde_json = "1"
