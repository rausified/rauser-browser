name: PR hygiene

# Cheap ubuntu checks for repository process (AGENTS.md "PR ownership and
# handoff"): every PR body names its owner session, and the dev tooling under
# scripts/dev keeps passing its tests. Not part of the macOS/Windows build.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # The merge queue needs every required context reported on its merge_group
  # SHA; ownership was already checked on the PR, so this passes there.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner:
    name: PR owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/pr-owner.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - name: Check the PR body names its owner
        if: github.event_name == 'pull_request'
        run: node scripts/pr-owner.mjs

  dev-tools:
    name: Dev tools
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Worktree hygiene tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
