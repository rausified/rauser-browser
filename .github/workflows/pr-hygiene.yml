name: PR hygiene

# Cheap ubuntu checks for repository process (AGENTS.md "PR ownership and
# handoff"): every PR body names its owner session and holds no denylisted
# real identifier (scripts/privacy-scan.mjs), and the dev tooling under
# scripts/dev keeps passing its tests. Not part of the macOS/Windows build.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # The merge queue needs every required context reported on its merge_group
  # SHA; ownership was already checked on the PR, so this passes there.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owner:
    name: PR owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/pr-owner.mjs
            scripts/privacy-scan.mjs
            scripts/privacy-denylist.sha256
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - name: Check the PR body names its owner
        if: github.event_name == 'pull_request'
        run: node scripts/pr-owner.mjs
      # Here rather than in ci.yml because this workflow reruns when the PR
      # title or body is edited (AGENTS.md "Local checks", privacy scan).
      - name: Scan the PR title and body for known real identifiers
        if: github.event_name == 'pull_request'
        run: node scripts/privacy-scan.mjs --pr-event

  # Required through .mergify.yml's queue_conditions (not branch protection):
  # since #431 the platform builds run these tests only for changes that can
  # affect them, so this unconditional run is the one every PR must pass.
  dev-tools:
    name: Dev tools
    # A body edit can cancel the previous run through workflow concurrency.
    # Its replacement must run these tests too, even on the same head SHA.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # docs/backlog: the queue tests render the committed backlog frame.
          # docs/improvement-feed: test_improvement_feed.py checks the real
          # entries and skips itself without them. docs/history and
          # docs/testing-log: test_split_docs.py checks the real split logs
          # (cone mode brings docs/history.md and TESTING.md with them).
          # .beads: test_work_queue.py
          # reads the committed README.md and config.yaml. (Cone mode always
          # brings the root files: worker-contract*.json, .gitattributes, the
          # feed.) ci-changes.test.mjs fails when a Python test names a path
          # this list leaves out.
          sparse-checkout: |
            scripts
            docs/backlog
            docs/improvement-feed
            docs/history
            docs/testing-log
            .beads
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Worktree hygiene tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
