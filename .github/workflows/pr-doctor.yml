name: PR doctor

# Two jobs, one owner for keeping PRs moving without a session watching:
# `doctor` repairs conflicts (below); `keeper` (scripts/pr-keeper.mjs) then
# queues labelled green PRs Mergify has not admitted, refreshes a stale
# Mergify, clears a needs-merge label merge-tree shows is stale, alerts on
# PRs only a person can unstick, and files a repair bead for the doctor's
# needs-person verdict. Neither merges, pushes to main, or force-pushes.

# A PR that conflicts with main runs no CI, so auto-merge waits on it forever
# with nothing failing. This finds those PRs, merges main into the ones whose
# conflicts are only old work-queue files (their bead edits are applied
# through bd and synced to refs/dolt/data, AGENTS.md "Work queue"),
# both-sides-appended Markdown or generated files (regenerated from the merged
# sources by scripts/merge-generated.mjs), and labels and comments on the rest
# (AGENTS.md "PR doctor", scripts/pr-doctor.mjs).
#
# Repairs are pushed only with the PR_DOCTOR_TOKEN secret (a fine-grained
# token with Contents and Pull requests write on this repository): a push
# made with the workflow's own GITHUB_TOKEN starts no workflows, so the
# repaired commit would get no CI. Without the secret the doctor reports only.
on:
  schedule:
    - cron: "*/15 * * * *"
  # CI finishing is when a PR turns green: the keeper runs then (and waits out
  # its green window once), since the cron above fires only every few hours
  # on this repository. Only the keeper job runs for this event.
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  # A push to a PR the doctor labelled needs-merge (usually the fix for the
  # conflict) runs it at once, so the label that keeps the PR out of
  # Mergify's queue clears within a minute. The */20 cron above runs only
  # every 4-7 hours on this repository (2026-11-09), and #384 waited an hour
  # on the label after its conflict was fixed. The job's `if` skips other PRs.
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report in the job summary only; no pushes, labels or comments"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Three jobs (scripts/pr-doctor.mjs "Phases", brwr-p2a7). The merge and
  # regeneration run in doctor-repair, on its own runner (which has network
  # but no secret, and a GITHUB_TOKEN with no permissions), from a bundle of
  # main and the PR branches. It hands its results back as an artifact that
  # the publish job (`doctor`, a fresh runner with its own checkout of main
  # and main's tools) treats as untrusted data: it takes the PR list from the
  # plan job's output, re-reads each PR from the API, and pushes a repaired
  # commit only if it is the merge publish derives itself (git merge-tree,
  # the append-only Markdown rule, and main's generators). Separate jobs, not
  # steps: a step shares its runner's memory, environment files, tools and
  # git config with the next.
  # What this protects against: hostile content in a PR branch reaching the
  # push token through the merge or a generator. Not a hostile collaborator:
  # a same-repo PR's own copy of this workflow runs on pull_request with the
  # secret. Known limit: `permissions: {}` does not remove the Actions
  # runtime token, so code running in doctor-repair could still write
  # Actions cache entries or artifacts for this run; the publish job reads
  # only its own checkout, the API and the repair artifact as data.
  doctor-plan:
    name: PR doctor (list)
    # Fork PRs get no secrets and no write token; the doctor ignores them anyway.
    if: >-
      github.event_name != 'workflow_run' &&
      (github.event_name != 'pull_request' ||
       (contains(github.event.pull_request.labels.*.name, 'needs-merge') &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Job-level, so a skipped pull_request run never enters the group: GitHub
    # keeps one pending run per group and would cancel a pending real one.
    concurrency:
      group: pr-doctor
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repairs: ${{ steps.plan.outputs.repairs }}
      prs: ${{ steps.plan.outputs.prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # The token is for this clone only and stays out of .git/config; a
          # step that fetches gets it in its own environment (GIT_CONFIG_*).
          token: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Keep main's tools outside the working tree
        # The repair job runs only these copies (main's), never a PR's.
        run: |
          tools="$RUNNER_TEMP/doctor-input/tools"
          mkdir -p "$tools/dev"
          cp scripts/pr-doctor.mjs scripts/pr-constants.mjs scripts/work_queue.py scripts/render_backlog.py \
            scripts/check_queue_consistency.py scripts/merge-generated.mjs scripts/generate-starters.mjs \
            scripts/generate-current-state.mjs scripts/pr-doctor-git-auth.sh scripts/install-bd.sh \
            "$tools/"
          # The generated-file merge driver runs only these copies of the generators.
          cp protocol/generate.py "$tools/generate.py"
          # pr-doctor.mjs imports these; keep their relative layout.
          cp scripts/dev/queue-pr.mjs "$tools/dev/"
      # A separate clone holds the bd database (it caches no credential: the
      # header is only ever in this step's environment). The repair job gets
      # a copy to check queue edits against. Without it (bd missing, queue not
      # seeded, or a transport failure) the doctor cannot apply queue edits
      # and labels such PRs needs-merge with instructions instead.
      - name: Bootstrap the work queue
        id: queue
        continue-on-error: true
        env:
          BD_NON_INTERACTIVE: "1"
          DOCTOR_GIT_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
        run: |
          . "$RUNNER_TEMP/doctor-input/tools/pr-doctor-git-auth.sh"
          sh scripts/install-bd.sh "$RUNNER_TEMP/bin"
          git ls-remote --exit-code origin refs/dolt/data > /dev/null
          ws="$RUNNER_TEMP/queue-ws"
          git clone -q --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$ws"
          git -C "$ws" config user.name "PR doctor"
          git -C "$ws" config user.email "pr-doctor@users.noreply.github.com"
          (cd "$ws" && "$RUNNER_TEMP/bin/bd" bootstrap)
          # Data only: the database and the clone, without Dolt's cached
          # remote clone or bd's federation key (neither holds a credential
          # here; the header never reaches a file).
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/doctor-input/queue-ws.tar" \
            --exclude='git-remote-cache' --exclude='.beads-credential-key' queue-ws
      - name: List and fetch the conflicting PRs
        id: plan
        env:
          GH_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          DOCTOR_GIT_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          PR_DOCTOR_PUSH: ${{ secrets.PR_DOCTOR_TOKEN != '' && '1' || '0' }}
        run: |
          . "$RUNNER_TEMP/doctor-input/tools/pr-doctor-git-auth.sh"
          in="$RUNNER_TEMP/doctor-input"
          node "$in/tools/pr-doctor.mjs" --tools "$in/tools" --phase plan \
            --state "$in/state.json" --bundle-out "$in/repo.bundle" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.repairs != '0'
        with:
          name: doctor-input
          path: ${{ runner.temp }}/doctor-input
          retention-days: 1
          if-no-files-found: error

  doctor-repair:
    name: PR doctor (merge, no credential)
    needs: doctor-plan
    if: needs.doctor-plan.outputs.repairs != '' && needs.doctor-plan.outputs.repairs != '0'
    # No secret is referenced in this job and its token can do nothing.
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: doctor-input
          path: ${{ runner.temp }}/doctor-input
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Unpack main, the PR branches and the work queue
        id: unpack
        run: |
          in="$RUNNER_TEMP/doctor-input"
          git init -q -b doctor "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git fetch -q --no-tags "$in/repo.bundle" '+refs/remotes/origin/*:refs/remotes/origin/*'
          git checkout -q --detach origin/main
          git config user.name "PR doctor"
          git config user.email "pr-doctor@users.noreply.github.com"
          if [ -f "$in/queue-ws.tar" ]; then
            sh "$in/tools/install-bd.sh" "$RUNNER_TEMP/bin"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            tar -C "$RUNNER_TEMP" -xf "$in/queue-ws.tar"
            echo "workspace=$RUNNER_TEMP/queue-ws" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge main and regenerate
        working-directory: ${{ runner.temp }}/repo
        env:
          PR_DOCTOR_PYTHON: python
          BRAUSER_QUEUE_WORKSPACE: ${{ steps.unpack.outputs.workspace }}
        run: |
          in="$RUNNER_TEMP/doctor-input"
          out="$RUNNER_TEMP/doctor-repaired"
          mkdir -p "$out"
          node "$in/tools/pr-doctor.mjs" --tools "$in/tools" --phase repair \
            --state "$in/state.json" --bundle-out "$out/repaired.bundle"
          cp "$in/state.json" "$out/state.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-repaired
          path: ${{ runner.temp }}/doctor-repaired
          retention-days: 1
          if-no-files-found: error

  doctor:
    name: PR doctor
    needs: [doctor-plan, doctor-repair]
    # Also when the repair job failed or was cancelled: each PR it should have
    # repaired is then labelled needs-merge with that reason.
    if: >-
      always() && needs.doctor-plan.result == 'success' &&
      needs.doctor-plan.outputs.repairs != '' && needs.doctor-plan.outputs.repairs != '0'
    concurrency:
      group: pr-doctor-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A fresh runner: nothing the repair job wrote is here but the artifact,
      # which is read as data (scripts/pr-doctor.mjs publishPhase).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Keep main's tools outside the working tree
        run: |
          mkdir -p "$RUNNER_TEMP/pr-doctor/dev"
          cp scripts/pr-doctor.mjs scripts/pr-constants.mjs scripts/work_queue.py scripts/render_backlog.py \
            scripts/check_queue_consistency.py scripts/merge-generated.mjs scripts/generate-starters.mjs \
            scripts/generate-current-state.mjs scripts/pr-doctor-git-auth.sh \
            "$RUNNER_TEMP/pr-doctor/"
          cp protocol/generate.py "$RUNNER_TEMP/pr-doctor/generate.py"
          cp scripts/dev/queue-pr.mjs "$RUNNER_TEMP/pr-doctor/dev/"
      - name: Bootstrap the work queue
        id: queue
        continue-on-error: true
        env:
          BD_NON_INTERACTIVE: "1"
          DOCTOR_GIT_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
        run: |
          . "$RUNNER_TEMP/pr-doctor/pr-doctor-git-auth.sh"
          sh scripts/install-bd.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          ws="$RUNNER_TEMP/queue-ws"
          git clone -q --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$ws"
          git -C "$ws" config user.name "PR doctor"
          git -C "$ws" config user.email "pr-doctor@users.noreply.github.com"
          (cd "$ws" && "$RUNNER_TEMP/bin/bd" bootstrap)
          echo "workspace=$ws" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: doctor-repaired
          path: ${{ runner.temp }}/doctor-repaired
      - name: Check, sync the queue and push the repairs
        env:
          GH_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          DOCTOR_GIT_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          PR_DOCTOR_PUSH: ${{ secrets.PR_DOCTOR_TOKEN != '' && '1' || '0' }}
          PR_DOCTOR_PYTHON: python
          PR_DOCTOR_PRS: ${{ needs.doctor-plan.outputs.prs }}
          BRAUSER_QUEUE_WORKSPACE: ${{ steps.queue.outputs.workspace }}
          # No global or system git config over the untrusted bundle (hooks
          # are off per command too).
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          git config user.name "PR doctor"
          git config user.email "pr-doctor@users.noreply.github.com"
          . "$RUNNER_TEMP/pr-doctor/pr-doctor-git-auth.sh"
          repaired="$RUNNER_TEMP/doctor-repaired"
          bundle=""
          if [ -f "$repaired/repaired.bundle" ]; then bundle="--bundle $repaired/repaired.bundle"; fi
          # shellcheck disable=SC2086
          node "$RUNNER_TEMP/pr-doctor/pr-doctor.mjs" --tools "$RUNNER_TEMP/pr-doctor" --phase publish \
            --prs "$PR_DOCTOR_PRS" --state "$repaired/state.json" $bundle \
            ${{ inputs.dry_run && '--dry-run' || '' }}

  keeper:
    name: PR keeper
    needs: doctor
    # After the doctor when it ran; alone when it was skipped (workflow_run).
    if: >-
      always() && github.event_name != 'pull_request'
    concurrency:
      group: pr-keeper
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history: git merge-tree needs the merge base of main and each PR.
          fetch-depth: 0
          # The keeper step only fetches a public repo: keep the token out of .git/config.
          # The bead step below gets a credential through gh for its own pushes.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - name: Run the PR keeper
        id: keeper
        env:
          # Mergify takes commands from a user token; the workflow's own token
          # is the fallback (comments and labels still work).
          GH_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          PR_KEEPER_REPAIRS: ${{ runner.temp }}/pr-keeper-repairs.json
          # Wait out the green window once when CI just finished.
          PR_KEEPER_SETTLE: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: >-
          node scripts/pr-keeper.mjs
          ${{ inputs.dry_run && '--dry-run' || '' }}
      # The unattended repair path: a P1 bead per needs-person PR head, filed
      # through the queue tooling (scripts/dev/create-bead), only when needed.
      - name: File repair beads
        if: steps.keeper.outputs.repairs != '' && steps.keeper.outputs.repairs != '0'
        env:
          BD_NON_INTERACTIVE: "1"
          GH_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
        run: |
          gh auth setup-git
          sh scripts/install-bd.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          git config user.name "PR keeper"
          git config user.email "pr-keeper@users.noreply.github.com"
          bd bootstrap
          BRAUSER_QUEUE_WORKSPACE="$GITHUB_WORKSPACE" \
            node scripts/pr-keeper.mjs --file-repairs "$RUNNER_TEMP/pr-keeper-repairs.json"
