name: PR doctor

# A PR that conflicts with main runs no CI, so auto-merge waits on it forever
# with nothing failing. This finds those PRs, merges main into the ones whose
# conflicts are only old work-queue files (their bead edits are applied
# through bd and synced to refs/dolt/data, AGENTS.md "Work queue") or
# both-sides-appended Markdown, and labels and comments on the rest
# (AGENTS.md "PR doctor", scripts/pr-doctor.mjs).
#
# Repairs are pushed only with the PR_DOCTOR_TOKEN secret (a fine-grained
# token with Contents and Pull requests write on this repository): a push
# made with the workflow's own GITHUB_TOKEN starts no workflows, so the
# repaired commit would get no CI. Without the secret the doctor reports only.
on:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report in the job summary only; no pushes, labels or comments"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-doctor
  cancel-in-progress: false

jobs:
  doctor:
    name: PR doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # The push credential: the secret when set, so repaired commits get CI.
          token: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Keep main's tools outside the working tree
        # The repair checks out PR branches; only main's copies ever run.
        run: |
          mkdir -p "$RUNNER_TEMP/pr-doctor"
          cp scripts/pr-doctor.mjs scripts/work_queue.py scripts/render_backlog.py \
            scripts/check_queue_consistency.py "$RUNNER_TEMP/pr-doctor/"
          git config user.name "PR doctor"
          git config user.email "pr-doctor@users.noreply.github.com"
      # A separate clone holds the bd database, so checking out PR branches
      # never touches it. Without it (bd missing, queue not seeded, or a
      # transport failure) the doctor cannot apply queue edits and labels
      # such PRs needs-merge with instructions instead.
      - name: Bootstrap the work queue
        id: queue
        continue-on-error: true
        env:
          BD_NON_INTERACTIVE: "1"
        run: |
          sh scripts/install-bd.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          git ls-remote --exit-code origin refs/dolt/data > /dev/null
          header=$(git config --get "http.https://github.com/.extraheader")
          ws="$RUNNER_TEMP/queue-ws"
          git -c "http.https://github.com/.extraheader=$header" clone -q --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$ws"
          git -C "$ws" config "http.https://github.com/.extraheader" "$header"
          git -C "$ws" config user.name "PR doctor"
          git -C "$ws" config user.email "pr-doctor@users.noreply.github.com"
          (cd "$ws" && "$RUNNER_TEMP/bin/bd" bootstrap)
          echo "workspace=$ws" >> "$GITHUB_OUTPUT"
      - name: Run the PR doctor
        env:
          GH_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          PR_DOCTOR_PUSH: ${{ secrets.PR_DOCTOR_TOKEN != '' && '1' || '0' }}
          PR_DOCTOR_PYTHON: python
          BRAUSER_QUEUE_WORKSPACE: ${{ steps.queue.outputs.workspace }}
        run: >-
          node "$RUNNER_TEMP/pr-doctor/pr-doctor.mjs" --tools "$RUNNER_TEMP/pr-doctor"
          ${{ inputs.dry_run && '--dry-run' || '' }}
