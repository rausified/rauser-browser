name: PR doctor

# Two jobs, one owner for keeping PRs moving without a session watching:
# `doctor` repairs conflicts (below); `keeper` (scripts/pr-keeper.mjs) then
# queues labelled green PRs Mergify has not admitted, refreshes a stale
# Mergify, clears a needs-merge label merge-tree shows is stale, alerts on
# PRs only a person can unstick, and files a repair bead for the doctor's
# needs-person verdict. Neither merges, pushes to main, or force-pushes.

# A PR that conflicts with main runs no CI, so auto-merge waits on it forever
# with nothing failing. This finds those PRs, merges main into the ones whose
# conflicts are only old work-queue files (their bead edits are applied
# through bd and synced to refs/dolt/data, AGENTS.md "Work queue") or
# both-sides-appended Markdown, and labels and comments on the rest
# (AGENTS.md "PR doctor", scripts/pr-doctor.mjs).
#
# Repairs are pushed only with the PR_DOCTOR_TOKEN secret (a fine-grained
# token with Contents and Pull requests write on this repository): a push
# made with the workflow's own GITHUB_TOKEN starts no workflows, so the
# repaired commit would get no CI. Without the secret the doctor reports only.
on:
  schedule:
    - cron: "*/15 * * * *"
  # CI finishing is when a PR turns green: the keeper runs then (and waits out
  # its green window once), since the cron above fires only every few hours
  # on this repository. Only the keeper job runs for this event.
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  # A push to a PR the doctor labelled needs-merge (usually the fix for the
  # conflict) runs it at once, so the label that keeps the PR out of
  # Mergify's queue clears within a minute. The */20 cron above runs only
  # every 4-7 hours on this repository (2026-11-09), and #384 waited an hour
  # on the label after its conflict was fixed. The job's `if` skips other PRs.
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report in the job summary only; no pushes, labels or comments"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  doctor:
    name: PR doctor
    # Fork PRs get no secrets and no write token; the doctor ignores them anyway.
    if: >-
      github.event_name != 'workflow_run' &&
      (github.event_name != 'pull_request' ||
       (contains(github.event.pull_request.labels.*.name, 'needs-merge') &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Job-level, so a skipped pull_request run never enters the group: GitHub
    # keeps one pending run per group and would cancel a pending real one.
    concurrency:
      group: pr-doctor
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # The push credential: the secret when set, so repaired commits get CI.
          token: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Keep main's tools outside the working tree
        # The repair checks out PR branches; only main's copies ever run.
        run: |
          mkdir -p "$RUNNER_TEMP/pr-doctor/dev"
          cp scripts/pr-doctor.mjs scripts/pr-constants.mjs scripts/work_queue.py scripts/render_backlog.py \
            scripts/check_queue_consistency.py "$RUNNER_TEMP/pr-doctor/"
          # pr-doctor.mjs imports these; keep their relative layout.
          cp scripts/dev/queue-pr.mjs "$RUNNER_TEMP/pr-doctor/dev/"
          git config user.name "PR doctor"
          git config user.email "pr-doctor@users.noreply.github.com"
      # A separate clone holds the bd database, so checking out PR branches
      # never touches it. Without it (bd missing, queue not seeded, or a
      # transport failure) the doctor cannot apply queue edits and labels
      # such PRs needs-merge with instructions instead.
      - name: Bootstrap the work queue
        id: queue
        continue-on-error: true
        env:
          BD_NON_INTERACTIVE: "1"
        run: |
          sh scripts/install-bd.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          git ls-remote --exit-code origin refs/dolt/data > /dev/null
          header=$(git config --get "http.https://github.com/.extraheader")
          ws="$RUNNER_TEMP/queue-ws"
          git -c "http.https://github.com/.extraheader=$header" clone -q --depth 1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$ws"
          git -C "$ws" config "http.https://github.com/.extraheader" "$header"
          git -C "$ws" config user.name "PR doctor"
          git -C "$ws" config user.email "pr-doctor@users.noreply.github.com"
          (cd "$ws" && "$RUNNER_TEMP/bin/bd" bootstrap)
          echo "workspace=$ws" >> "$GITHUB_OUTPUT"
      - name: Run the PR doctor
        env:
          GH_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          PR_DOCTOR_PUSH: ${{ secrets.PR_DOCTOR_TOKEN != '' && '1' || '0' }}
          PR_DOCTOR_PYTHON: python
          BRAUSER_QUEUE_WORKSPACE: ${{ steps.queue.outputs.workspace }}
        run: >-
          node "$RUNNER_TEMP/pr-doctor/pr-doctor.mjs" --tools "$RUNNER_TEMP/pr-doctor"
          ${{ inputs.dry_run && '--dry-run' || '' }}

  keeper:
    name: PR keeper
    needs: doctor
    # After the doctor when it ran; alone when it was skipped (workflow_run).
    if: >-
      always() && github.event_name != 'pull_request'
    concurrency:
      group: pr-keeper
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history: git merge-tree needs the merge base of main and each PR.
          fetch-depth: 0
          token: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - name: Run the PR keeper
        id: keeper
        env:
          # Mergify takes commands from a user token; the workflow's own token
          # is the fallback (comments and labels still work).
          GH_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
          PR_KEEPER_REPAIRS: ${{ runner.temp }}/pr-keeper-repairs.json
          # Wait out the green window once when CI just finished.
          PR_KEEPER_SETTLE: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: >-
          node scripts/pr-keeper.mjs
          ${{ inputs.dry_run && '--dry-run' || '' }}
      # The unattended repair path: a P1 bead per needs-person PR head, filed
      # through the queue tooling (scripts/dev/create-bead), only when needed.
      - name: File repair beads
        if: steps.keeper.outputs.repairs != '' && steps.keeper.outputs.repairs != '0'
        env:
          BD_NON_INTERACTIVE: "1"
          GH_TOKEN: ${{ secrets.PR_DOCTOR_TOKEN || github.token }}
        run: |
          sh scripts/install-bd.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          git config user.name "PR keeper"
          git config user.email "pr-keeper@users.noreply.github.com"
          bd bootstrap
          BRAUSER_QUEUE_WORKSPACE="$GITHUB_WORKSPACE" \
            node scripts/pr-keeper.mjs --file-repairs "$RUNNER_TEMP/pr-keeper-repairs.json"
