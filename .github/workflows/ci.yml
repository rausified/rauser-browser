name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify generated protocol types
        run: python protocol/generate.py --check
      - name: Check contributor status documentation
        run: python scripts/check_current_state.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build Rust workspace
        run: cargo build --locked --workspace --all-targets
      - name: Run Rust tests
        run: cargo test --locked --workspace
      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the scripted-dialogs test build
        run: cargo test --locked -p brauser --features scripted-dialogs --target-dir target/scripted-dialogs
      - name: Lint the scripted-dialogs test build
        run: cargo clippy --locked -p brauser --all-targets --features scripted-dialogs --target-dir target/scripted-dialogs -- -D warnings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install TypeScript tooling
        run: npm ci --ignore-scripts
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Lint TypeScript
        run: npm run lint
      - name: Build unpacked Chrome extension
        run: npm run build:extension
      # The shared adapter-template vectors, including the timed bounds cases,
      # run in both engines: Rust in `cargo test`, TypeScript here.
      - name: Run extension worker tests
        run: npm run test:extension
      - name: Run development script tests
        run: npm run test:scripts
      # Uses the host built by "Build Rust workspace" and the extension build.
      - name: Compare adapter-template engines on generated cases
        run: npm run test:adapter-diff -- --cases 5000
      # End-to-end run in headless Chrome (preinstalled on the runner image)
      # against the scripted-dialogs host; nothing is shown on screen.
      - name: Build scripted-dialogs host
        run: cargo build --locked -p brauser --features scripted-dialogs --target-dir target/scripted-dialogs
      - name: Run headless macOS smoke test
        run: npm run smoke:macos:headless
      # The fuzz targets are their own workspace; running them needs nightly
      # and cargo-fuzz, so CI only keeps them compiling.
      - name: Check adapter-template fuzz targets compile
        run: cargo check --locked --manifest-path adapter-templates/fuzz/Cargo.toml --bins
      - name: Audit npm lockfile
        run: npm audit --audit-level=high

  cargo-deny:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  dependency-review:
    name: Review new dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
