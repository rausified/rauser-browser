name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every platform runs the same steps from build-os.yml.
  build-macos:
    name: macOS
    uses: ./.github/workflows/build-os.yml
    with:
      os: macos-15

  build-windows:
    name: Windows
    uses: ./.github/workflows/build-os.yml
    with:
      os: windows-latest

  # GitHub's hosted macos-15 pool is sometimes starved: the job is never
  # acquired by a runner and GitHub cancels it with zero steps run. That
  # shows up as result 'cancelled', so only then rerun the same build on
  # macos-14. A real macos-15 failure (result 'failure') does not fall back.
  # GitHub has no queue timeout for hosted jobs (job timeout-minutes only
  # counts time on a runner), so this waits for GitHub's own cancellation.
  build-macos-fallback:
    name: macOS fallback
    needs: build-macos
    if: always() && needs.build-macos.result == 'cancelled'
    uses: ./.github/workflows/build-os.yml
    with:
      os: macos-14

  # Branch protection requires a check named exactly "Build and check"; the
  # per-OS jobs report under their own names, so this job stands for all of
  # them. Pass needs Windows plus macOS, where macOS is either the macos-15
  # build or, only when that build was cancelled, the macos-14 fallback.
  build-gate:
    name: Build and check
    needs: [build-macos, build-windows, build-macos-fallback]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform build to pass
        env:
          MACOS: ${{ needs.build-macos.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          FALLBACK: ${{ needs.build-macos-fallback.result }}
        run: |
          echo "macos-15: $MACOS; windows: $WINDOWS; macos-14 fallback: $FALLBACK"
          test "$WINDOWS" = success
          if [ "$MACOS" = success ]; then exit 0; fi
          test "$MACOS" = cancelled && test "$FALLBACK" = success

  cargo-deny:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  dependency-review:
    name: Review new dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
