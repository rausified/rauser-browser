name: CI

on:
  push:
    branches: [main]
  # Also the Mergify queue's draft PRs (`mergify/merge-queue/<hex>` heads, main
  # plus the queued PR; .mergify.yml): no head-branch filter may skip them,
  # because the queue merges only once these checks pass on the draft.
  pull_request:
  # GitHub's own merge queue (merge_group commits) needs an organization-owned
  # repository; this trigger is unused today and harmless.
  merge_group:

permissions:
  contents: read

# A new push to a PR cancels that PR's superseded run. Pushes to main and
# merge_group runs each get their own group (the run id), so they are never
# cancelled or replaced by a later run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only changes (root Markdown, docs/**, .beads/** config;
  # scripts/ci-changes.mjs has the exact rule) skip the macOS and Windows
  # builds and run the cheap docs-checks job instead. A PR compares its merge commit with that commit's
  # base parent; a merge group compares its head with the queue's base commit.
  # Pushes to main always build.
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      macos: ${{ steps.classify.outputs.macos }}
      dev_tools: ${{ steps.classify.outputs.dev_tools }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checkout is its merge commit; depth 2 brings the base parent.
          fetch-depth: 2
      - name: Find the base commit to compare against
        id: base
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            merge_group)
              git fetch --no-tags --depth=1 origin "$QUEUE_BASE"
              base=$QUEUE_BASE ;;
            *) base= ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Classify the changed paths
        id: classify
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          if [ -z "$BASE" ]; then
            echo "$GITHUB_EVENT_NAME: always build, macOS included"
            printf '%s\n' docs_only=false macos=true dev_tools=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci-changes.mjs "$BASE" HEAD

  docs-checks:
    name: Docs and queue checks
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check contributor status documentation
        run: python scripts/check_current_state.py
      # The work queue lives in Dolt (refs/dolt/data), checked on a schedule
      # by queue-check.yml, not per PR; check_current_state.py above
      # fails a change that commits a queue file here. The queue tools' own
      # tests are scripts, so a change to them is code and builds.

  # Every platform runs the same steps from build-os.yml. macOS runs only for
  # a change that can behave differently there (scripts/ci-macos.mjs: macOS
  # paths, Unix-only host Rust and what it reads); Windows runs for every code
  # change,
  # and every push to main runs both, so main's own run catches anything a
  # PR's skipped macOS build would have.
  build-macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/build-os.yml
    with:
      os: macos-15
      # The Python dev-tools tests run only when the change can affect them
      # (scripts/ci-changes.mjs devToolsReasons); anything but an explicit
      # false runs them.
      dev_tools: ${{ needs.changes.outputs.dev_tools != 'false' }}

  # The axe and keyboard checks of the built extension pages: platform
  # independent, so they run once on Linux (Chrome is on the runner image)
  # for every code change instead of tying page changes to macOS.
  a11y:
    name: Accessibility
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install TypeScript tooling
        run: npm ci --ignore-scripts
      - name: Build unpacked Chrome extension
        run: npm run build:extension
      - name: Check built pages with axe and keyboard navigation
        env:
          BRAUSER_REQUIRE_A11Y_TESTS: "1"
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_PATH" || { echo "::error::no Chrome on the runner image"; exit 1; }
          export CHROME_PATH
          npm run test:a11y

  build-windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/build-os.yml
    with:
      os: windows-latest
      dev_tools: ${{ needs.changes.outputs.dev_tools != 'false' }}

  # The fuzz crate (adapter-templates/fuzz) is its own workspace depending
  # only on adapter-templates, so checking it compiles is cheap: no nightly
  # toolchain or cargo-fuzz needed, just `cargo check`. It used to run only
  # in build-os.yml's macOS leg, which most PRs skip (scripts/ci-macos.mjs),
  # so a change to adapter-templates/src that broke it (#379, brwr-nu0m)
  # passed Windows, Codex and every local gate and was caught only once the
  # PR reached the queue. Running it here, unconditionally on ubuntu, covers
  # every code PR regardless of whether it needs the macOS build.
  fuzz-check:
    name: Fuzz targets compile
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz-check
          workspaces: adapter-templates/fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check adapter-template fuzz targets compile
        run: cargo check --locked --manifest-path adapter-templates/fuzz/Cargo.toml --bins

  # The repository is public and its rule is synthetic data only. This scans
  # every tracked file and the change's commit messages against scripts/privacy-denylist.sha256, salted hashes of known-real
  # identifiers (scripts/privacy-scan.mjs). It runs for every change, docs-only
  # included, because plans and fixtures are where real identifiers slipped in
  # (#394, #400).
  privacy-scan:
    name: Privacy scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      # A PR scans its own commits (the merge commit's second parent, minus
      # base); a push scans every pushed commit. The PR title and body are
      # scanned by pr-hygiene.yml's PR owner job, which reruns on an edit.
      - name: Scan the tree and commit messages for known real identifiers
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range='HEAD^!'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range='HEAD^1..HEAD^2'
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          node scripts/privacy-scan.mjs --tree --commits "$range"

  # GitHub's hosted macos-15 pool is sometimes starved: the job is never
  # acquired by a runner and GitHub cancels it with zero steps run. The job
  # shows as cancelled, and `needs.<job>.result` reads 'abandoned' (seen live
  # on PR #107, run 40552639162). 'cancelled' also covers a job that timed out
  # or was interrupted after it started, so this job asks the API whether the
  # macos-15 job ever ran a step; only a zero-step cancellation counts as
  # starvation. A real macos-15 failure (result 'failure') never falls back.
  # build-os.yml runs two parallel jobs per OS (`build` and `scripted`), so
  # this looks at every "macOS / ..." job: it is starvation only when no
  # macos-15 job failed or was cancelled after starting, and at least one
  # was cancelled with zero steps run.
  # GitHub has no queue timeout for hosted jobs (job timeout-minutes only
  # counts time on a runner), so this waits for GitHub's own cancellation.
  macos-starvation-check:
    name: Detect macOS runner starvation
    needs: build-macos
    if: >-
      always() &&
      (needs.build-macos.result == 'cancelled' || needs.build-macos.result == 'abandoned')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: read
    outputs:
      starved: ${{ steps.check.outputs.starved }}
    steps:
      - name: Check whether the macos-15 job ran any step
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          # "<caller job name> / <reusable workflow job name>"; the prefix
          # matches both build-os.yml jobs, never "macOS fallback / ...".
          JOB_PREFIX: "macOS / "
          PULLS_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A newer push cancels this PR run, and a macOS job still waiting for
          # a runner then also shows as cancelled with zero steps. That is not
          # starvation: never start the fallback for a superseded head.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            head=$(gh api "$PULLS_URL" --jq .head.sha)
            if [ "$head" != "$RUN_HEAD" ]; then
              echo "superseded: PR head is now $head, this run built $RUN_HEAD"
              echo "starved=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # One line per macOS job: "<conclusion> <steps run> <name>".
          jobs=$(gh api --paginate "$JOBS_URL" \
            --jq '.jobs[] | select(.name | startswith(env.JOB_PREFIX)) | "\(.conclusion // .status) \(.steps | length) \(.name)"')
          echo "${jobs:-no $JOB_PREFIX jobs found}"
          starved=false
          if [ -n "$jobs" ]; then
            # A failure, or a cancellation after a step ran (a timeout or an
            # interruption), is never starvation; a zero-step cancellation is.
            if ! printf '%s\n' "$jobs" | awk '$1 == "failure" || ($1 == "cancelled" && $2 > 0) { bad = 1 } END { exit bad }'; then
              starved=false
            elif printf '%s\n' "$jobs" | awk '$1 == "cancelled" && $2 == 0 { found = 1 } END { exit !found }'; then
              starved=true
            fi
          fi
          echo "starved=$starved"
          echo "starved=$starved" >> "$GITHUB_OUTPUT"

  build-macos-fallback:
    name: macOS fallback
    needs: [changes, macos-starvation-check]
    if: always() && needs.macos-starvation-check.outputs.starved == 'true'
    uses: ./.github/workflows/build-os.yml
    with:
      os: macos-15-intel
      dev_tools: ${{ needs.changes.outputs.dev_tools != 'false' }}

  # Branch protection requires a check named exactly "Build and check"; the
  # per-OS jobs report under their own names, so this job stands for all of
  # them. A code change passes with Windows and Accessibility passing, plus,
  # when the classifier says the change needs macOS, the macos-15 build or,
  # only when that job was starved of a runner, the macos-15-intel (x64)
  # fallback; when it does not, macOS must have been skipped. A docs-only
  # change passes when the classifier ran, both builds were skipped as
  # intended, and docs-checks passed. Every change, docs-only included, also
  # needs the privacy scan.
  build-gate:
    name: Build and check
    needs: [changes, docs-checks, a11y, fuzz-check, privacy-scan, build-macos, build-windows, macos-starvation-check, build-macos-fallback]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform build to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          MACOS_NEEDED: ${{ needs.changes.outputs.macos }}
          DOCS: ${{ needs.docs-checks.result }}
          A11Y: ${{ needs.a11y.result }}
          FUZZ: ${{ needs.fuzz-check.result }}
          PRIVACY: ${{ needs.privacy-scan.result }}
          MACOS: ${{ needs.build-macos.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          STARVED: ${{ needs.macos-starvation-check.outputs.starved }}
          FALLBACK: ${{ needs.build-macos-fallback.result }}
        run: |
          echo "classify: $CHANGES (docs only: ${DOCS_ONLY:-n/a}; macOS needed: ${MACOS_NEEDED:-n/a}); docs checks: $DOCS; accessibility: $A11Y; fuzz targets: $FUZZ; privacy scan: $PRIVACY"
          echo "macos-15: $MACOS; windows: $WINDOWS; macos-15 starved: ${STARVED:-n/a}; macos-15-intel fallback: $FALLBACK"
          test "$CHANGES" = success
          test "$PRIVACY" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS" = success && test "$MACOS" = skipped && test "$WINDOWS" = skipped && test "$FUZZ" = skipped
            exit 0
          fi
          test "$WINDOWS" = success
          test "$A11Y" = success
          test "$FUZZ" = success
          if [ "$MACOS_NEEDED" != true ]; then
            test "$MACOS" = skipped
            exit 0
          fi
          if [ "$MACOS" = success ]; then exit 0; fi
          case "$MACOS" in cancelled|abandoned) ;; *) exit 1 ;; esac
          test "$STARVED" = true && test "$FALLBACK" = success

  cargo-deny:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  dependency-review:
    name: Review new dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
