name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every platform runs the same steps from build-os.yml.
  build-macos:
    name: macOS
    uses: ./.github/workflows/build-os.yml
    with:
      os: macos-15

  build-windows:
    name: Windows
    uses: ./.github/workflows/build-os.yml
    with:
      os: windows-latest

  # GitHub's hosted macos-15 pool is sometimes starved: the job is never
  # acquired by a runner and GitHub cancels it with zero steps run. The job
  # shows as cancelled, and `needs.<job>.result` reads 'abandoned' (seen live
  # on PR #107, run 40552639162). 'cancelled' also covers a job that timed out
  # or was interrupted after it started, so this job asks the API whether the
  # macos-15 job ever ran a step; only a zero-step cancellation counts as
  # starvation. A real macos-15 failure (result 'failure') never falls back.
  # GitHub has no queue timeout for hosted jobs (job timeout-minutes only
  # counts time on a runner), so this waits for GitHub's own cancellation.
  macos-starvation-check:
    name: Detect macOS runner starvation
    needs: build-macos
    if: >-
      always() &&
      (needs.build-macos.result == 'cancelled' || needs.build-macos.result == 'abandoned')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      starved: ${{ steps.check.outputs.starved }}
    steps:
      - name: Check whether the macos-15 job ran any step
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          # "<caller job name> / <reusable workflow job name>"
          JOB_NAME: macOS / Build and check (macos-15)
        run: |
          steps=$(gh api --paginate "$JOBS_URL" \
            --jq '.jobs[] | select(.name == env.JOB_NAME) | .steps | length')
          echo "$JOB_NAME steps run: ${steps:-not found}"
          if [ "$steps" = 0 ]; then
            echo "starved=true" >> "$GITHUB_OUTPUT"
          else
            echo "starved=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos-fallback:
    name: macOS fallback
    needs: macos-starvation-check
    if: always() && needs.macos-starvation-check.outputs.starved == 'true'
    uses: ./.github/workflows/build-os.yml
    with:
      os: macos-15-intel

  # Branch protection requires a check named exactly "Build and check"; the
  # per-OS jobs report under their own names, so this job stands for all of
  # them. Pass needs Windows plus macOS, where macOS is either the macos-15
  # build or, only when that job was starved of a runner, the macos-15-intel (x64)
  # fallback.
  build-gate:
    name: Build and check
    needs: [build-macos, build-windows, macos-starvation-check, build-macos-fallback]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform build to pass
        env:
          MACOS: ${{ needs.build-macos.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          STARVED: ${{ needs.macos-starvation-check.outputs.starved }}
          FALLBACK: ${{ needs.build-macos-fallback.result }}
        run: |
          echo "macos-15: $MACOS; windows: $WINDOWS; macos-15 starved: ${STARVED:-n/a}; macos-15-intel fallback: $FALLBACK"
          test "$WINDOWS" = success
          if [ "$MACOS" = success ]; then exit 0; fi
          case "$MACOS" in cancelled|abandoned) ;; *) exit 1 ;; esac
          test "$STARVED" = true && test "$FALLBACK" = success

  cargo-deny:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  dependency-review:
    name: Review new dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
