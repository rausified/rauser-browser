name: Merge hold

# A PR labeled `final-stretch` holds every other open PR (pending
# `merge-hold` status) until it merges or loses the label; see scripts/merge-hold.mjs and
# AGENTS.md "Review and merge cadence". Every PR event that can change the
# hold re-evaluates all open PRs.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: merge-hold
  cancel-in-progress: false

jobs:
  merge-hold:
    name: Merge hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/merge-hold.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - name: Set merge-hold on every open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/merge-hold.mjs
