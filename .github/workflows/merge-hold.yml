name: Merge hold

# RETIRED (2026-11-03). The `final-stretch` hold is gone: Mergify's queue
# (.mergify.yml, AGENTS.md "Review and merge cadence") now serializes merges
# and tests each PR on top of current main. Nothing reads the `final-stretch`
# label any more.
#
# This workflow stays only because `merge-hold` is still a REQUIRED status
# check in main's branch protection, which agents cannot edit (no admin).
# Deleting it would leave every PR waiting for a status that never comes. It
# now posts `merge-hold: success` on every PR head (Mergify's draft
# `mergify/merge-queue/*` PRs included) and on merge_group commits. Once John
# removes `merge-hold` from the required checks, delete this file.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
  # The sweep: open PRs whose head still carries a pending hold from before
  # the retirement (on the merge of this file), and fork PRs, whose
  # pull_request token cannot post statuses.
  push:
    branches: [main]
    paths: [.github/workflows/merge-hold.yml]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('merge-hold-pr-{0}', github.event.pull_request.number) || format('merge-hold-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  merge-hold:
    name: Merge hold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report merge-hold success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) shas=$PR_HEAD ;;
            merge_group) shas=$SHA ;;
            *) shas=$(gh pr list --repo "$REPO" --state open --limit 1000 --json headRefOid --jq '.[].headRefOid') ;;
          esac
          for sha in $shas; do
            gh api --silent -X POST "repos/$REPO/statuses/$sha" \
              -f state=success -f context=merge-hold \
              -f description="Retired: the Mergify queue replaced the final-stretch hold"
            echo "${sha:0:7} success"
          done
