name: Build and check (one OS)

# Reusable per-OS build. ci.yml calls this once per runner (macOS primary,
# Windows, and the macOS fallback) so every platform runs identical steps.
on:
  workflow_call:
    inputs:
      os:
        description: GitHub-hosted runner label, e.g. macos-15 or windows-latest.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and check (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    env:
      # Unix-socket tests may skip themselves when a local sandbox denies IPC
      # (EPERM/EACCES on bind) and this flag is unset. CI runners never
      # sandbox IPC, so a bind failure here is a real failure: never skip.
      BRAUSER_REQUIRE_IPC_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify generated protocol types
        run: python protocol/generate.py --check
      - name: Check contributor status documentation
        run: python scripts/check_current_state.py
      - name: Test the backlog renderer and queue check
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Check the generated backlog against the beads queue
        run: python scripts/check_queue_consistency.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build Rust workspace
        run: cargo build --locked --workspace --all-targets
      - name: Run Rust tests
        run: cargo test --locked --workspace
      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the scripted-dialogs test build
        run: cargo test --locked -p brauser --features scripted-dialogs --target-dir target/scripted-dialogs
      - name: Lint the scripted-dialogs test build
        run: cargo clippy --locked -p brauser --all-targets --features scripted-dialogs --target-dir target/scripted-dialogs -- -D warnings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install TypeScript tooling
        run: npm ci --ignore-scripts
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Lint TypeScript
        run: npm run lint
      - name: Build unpacked Chrome extension
        run: npm run build:extension
      # The shared adapter-template vectors, including the timed bounds cases,
      # run in both engines: Rust in `cargo test`, TypeScript here.
      - name: Run extension worker tests
        run: npm run test:extension
      # Renders the host neutralizer's corpus outputs with markdown-it,
      # micromark (GFM) and marked and fails on any live element.
      - name: Check the Markdown neutralizer with real renderers
        run: npm run test:markdown-neutralizer
      - name: Run development script tests
        run: npm run test:scripts
      # Uses the host built by "Build Rust workspace" and the extension build.
      - name: Compare adapter-template engines on generated cases
        run: npm run test:adapter-diff -- --cases 5000
      # End-to-end run in headless Chrome (preinstalled on the runner image)
      # against the scripted-dialogs host; nothing is shown on screen.
      - name: Build scripted-dialogs host
        run: cargo build --locked -p brauser --features scripted-dialogs --target-dir target/scripted-dialogs
      - name: Run headless macOS smoke test
        if: runner.os == 'macOS'
        run: npm run smoke:macos:headless
      # The fuzz targets are their own workspace; running them needs nightly
      # and cargo-fuzz, so CI only keeps them compiling.
      # Keep this Unix/libFuzzer check on macOS; Windows runs the shared
      # vectors and differential tests above against its native host.
      - name: Check adapter-template fuzz targets compile
        if: runner.os == 'macOS'
        run: cargo check --locked --manifest-path adapter-templates/fuzz/Cargo.toml --bins
      - name: Audit npm lockfile
        run: npm audit --audit-level=high
